# Copy to .github/workflows/node-ci.yml in a repo that has package-lock.json.
# cache: npm needs that lockfile. Without it, remove cache: npm or add a lockfile.
name: Node CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload test output if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-node-${{ matrix.node-version }}
          path: |
            npm-debug.log
          if-no-files-found: ignore
