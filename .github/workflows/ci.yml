name: Check modules and site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Module honesty checks
        run: .agents/skills/enhance-module/scripts/check-module.sh
      - run: npm ci
      - name: Generated indexes match curriculum
        run: node scripts/sync-indexes.mjs --check
      - run: npm run build
        env:
          SITE_BASE: /devops-mastery-guide
