name: Check modules and site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Module honesty checks
        run: |
          set -e
          for m in 01-linux 02-ansible 03-docker 04-kubernetes 05-terraform 06-prometheus 07-grafana 08-github-actions; do
            .agents/skills/enhance-module/scripts/check-module.sh "$m"
          done
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /devops-mastery-guide
