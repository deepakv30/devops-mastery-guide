# Role: verbs on resources in one namespace.
# RoleBinding: attach that Role to a subject (this ServiceAccount).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-logs
  namespace: default
subjects:
  - kind: ServiceAccount
    name: log-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-log-reader
