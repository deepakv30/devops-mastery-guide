apiVersion: v1
kind: Service
metadata:
  name: devops-demo-app
  labels:
    app: devops-demo-app
spec:
  selector:
    app: devops-demo-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    - name: metrics
      protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

