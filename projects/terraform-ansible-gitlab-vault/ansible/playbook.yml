# Production path — needs a real inventory, sudo, and a Vault you configured
# (see docs/vault-setup.md). For a first run use localhost.yml instead.
---
- name: Configure web servers with Vault secrets
  hosts: all
  become: true
  vars:
    # Fails until Vault is reachable. Unused in the nginx tasks below;
    # kept to show the lookup shape. Do not put real passwords in git.
    db_password: "{{ lookup('community.hashi_vault.vault_kv2', 'secret/data/devops/db', url='https://vault.example.com').data.data.password }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - nginx
          - python3
          - python3-pip
        state: present

    - name: Deploy application
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Configure Nginx
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
