# Copy to .github/workflows/docker-publish.yml in a repo that has a Dockerfile
# at the repository root. Pushes to GHCR with GITHUB_TOKEN — not a personal PAT.
#
# Required: permissions.packages: write. Image names on GHCR must be lowercase.
# Tag is the commit SHA, not latest.
name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
